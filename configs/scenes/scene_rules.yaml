# scene 구성 규칙 -- scene 추천기와 NewSceneDialog 가 공유하는 정본.
# 읽는 코드는 mstack/scene_rules.py.
version: 1
compose:
  # 같은 (category, color) 2개 금지 (전 소품) -- 개별 지칭이 모호해지기 때문.
  # 예외 (2026-08-31 사용자 확정): 포갤 수 있는 그릇류는 "stack all the {색}
  # {복수}" 라는 집합 지칭 문장이 성립하므로 모호성이 문제가 되지 않는다.
  # 똑같은 그릇 2개(핑크 스트라이프)는 예비품이 아니라 stack 과제의 재료다.
  # 한 씬에 한 쌍까지만 -- 두 쌍이면 개별 지칭 문장이 과하게 줄어든다.
  # 컵은 제외한다: 색 학습용 color_diverse 규칙이 걸려 있는 category 다.
  - rule: no_lookalike_pair
    stack_pair_categories: [small_bowl, bowl, large_bowl]
    max_stack_pairs: 1
  - rule: color_diverse                # 같은 category 2개 이상이면 색은 전부 달라야
    category: cup
  # shortcut 방지 (2026-08-24 사용자 확정): 아래 category 는 scene 에
  # 등장하려면 반드시 2개 이상이어야 한다 (위 규칙들과 결합되어 자동으로
  # 서로 다른 색). 한 개만 있으면 "the cup" 만으로 정답이 되어 색 학습이
  # 생략된다. drawer 는 단일 개체라 제외. 기존 수집분(S000~S009)은 소급
  # 적용하지 않는다 -- 새 scene·추천에만.
  # bowl(15cm, 2026-08-31 신설)도 같은 이유로 포함. cutlery 는 2026-08-31
  # 부터 색 없는 단일 번들("the cutlery")이라 색 학습 취지가 해당 없음 --
  # drawer/tray 처럼 제외 (활성 소품이 번들 1개뿐이라 포함하면 커트러리가
  # 어떤 새 scene 에도 못 들어간다).
  - rule: pair_if_present
    categories: [cup, small_bowl, bowl, large_bowl]
    min_count: 2
  # 담을 그릇이 있어야 커트러리가 나온다 (2026-09-08 사용자 확정).
  # 커트러리는 길쭉해서 small_bowl 이나 bowl(15cm)에는 넣기 어렵다 -- 실제로
  # 놓아 보면 걸치거나 넘어간다. 그래서 커트러리가 든 scene 은 tray 나
  # large_bowl 중 하나를 반드시 함께 갖는다. 담을 곳이 없는 커트러리는
  # "put the cutlery in the ..." 문장 자체가 성립하지 않는다.
  # 이미 수집한 scene_017 은 tray 와 함께 있어 소급 위반이 없다.
  - rule: requires_companion
    category: cutlery
    any_of: [tray, large_bowl]
  # 물체 개수 범위 (2026-09-06 설정으로 이관). 후보 생성 범위이자 count
  # 커버리지 축의 서포트라, 코드 상수로 두면 두 곳이 어긋난다.
  #
  # 2026-09-18: 5 -> 6. 물체가 적은 씬은 문법이 만들 수 있는 지시문 자체가
  # 적어(실측: 2물체 평균 5.3개, 4물체 24.5개, 6물체 48~64개), 그 씬에서는
  # 장면만 보고 할 일을 맞히게 된다 -- 실제로 그렇게 된 씬 넷을 데이터셋에서
  # 뺐다 (paper/scene_instructions). 상한을 올려 큰 씬을 만들 수 있게 한다.
  # 서랍이 있어도 6물체는 놓인다 (배치 5,040가지, 2026-09-18 실측) -- 서랍이
  # 열 하나를 막는다는 옛 주석은 틀렸다.
  - rule: object_count
    min: 2
    max: 6
placement:
  - rule: ban_zones                    # 해당 category 를 이 존에 두지 않는다
    category: drawer
    zones: [[1, 1], [2, 1]]            # 중앙 + 앞줄 중앙 (2026-08-26 사용자 확정)
  # 가림 방지 + 팔 경로 확보 (2026-09-06 사용자 확정 -- 2026-08-26 의
  # exclusive_column 을 대체한다). 그 규칙은 방향이 반대인 두 물리 사실을
  # "열 전체 비우기" 하나로 근사한 것이라, 주석이 근거를 가림으로만 적고 있었다.
  #
  # 격자 기하: row 2 가 카메라(agentview) 쪽, row 0 이 로봇(FR3) 쪽.
  # 키 큰 소품(props.yaml 의 tall)을 기준으로 그 열이 양분된다:
  #   - 카메라에서 더 먼 칸은 그 소품에 가려진다        -> occludes_behind
  #   - 로봇에서 더 먼 칸은 팔이 그 소품을 넘어가야 한다 -> robot_clearance
  # 둘의 합집합은 소품 칸을 뺀 열 전체라 막는 칸은 예전과 같다. 달라지는 것은
  # 위반 사유가 정확해지는 것과, 대상이 category 하드코딩이 아니라 tall 물성에서
  # 파생되어 키 큰 소품이 늘어도 규칙을 안 고쳐도 되는 것이다.
  # 기존 수집분에는 소급 적용하지 않는다.
  - rule: occludes_behind
    camera_row: 2
  - rule: robot_clearance
    robot_row: 0
